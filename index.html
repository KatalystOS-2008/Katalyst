// ─── Helpers ─────────────────────────────────────────
const trialDaysLeft = (profile) => {
  if (!profile?.trial_start) return CONFIG.TRIAL_DAYS;
  const ms = Date.now() - new Date(profile.trial_start).getTime();
  const days = Math.floor(ms / 86400000);
  return Math.max(0, CONFIG.TRIAL_DAYS - days);
};
const hasAccess = (profile) => {
  if (!profile) return false;
  if (profile.plan === 'monthly' || profile.plan === 'yearly') return true;
  return trialDaysLeft(profile) > 0;
};

const TRIAL_LIMIT = 10;

async function checkAndIncrementUsage(userId, plan) {
  // Paid users have no limits
  if (plan === 'monthly' || plan === 'yearly') return { allowed: true };

  const { data: prof } = await sb.from('profiles').select('generations_used, generations_reset_at').eq('id', userId).single();

  // Reset counter if it's been over 30 days
  const resetDate = new Date(prof.generations_reset_at);
  const daysSinceReset = (Date.now() - resetDate.getTime()) / 86400000;
  if (daysSinceReset > 30) {
    await sb.from('profiles').update({ generations_used: 0, generations_reset_at: new Date().toISOString() }).eq('id', userId);
    prof.generations_used = 0;
  }

  if (prof.generations_used >= TRIAL_LIMIT) {
    return { allowed: false, used: prof.generations_used };
  }

  // Increment the counter
  await sb.from('profiles').update({ generations_used: prof.generations_used + 1 }).eq('id', userId);
  return { allowed: true, used: prof.generations_used + 1 };
}

async function callClaude(system, user, maxTokens = 900) {
  try {
    const { data: sessionData, error: sessionError } = await sb.auth.getSession();

    let session = sessionData?.session;

    if (!session) {
      const { data: refreshData, error: refreshError } = await sb.auth.refreshSession();

      if (refreshError || !refreshData?.session) {
        return "Your session expired. Please login again.";
      }

      session = refreshData.session;
    }

    const token = session.access_token;

    const res = await fetch(CONFIG.CLAUDE_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`,
      },
      body: JSON.stringify({
        system,
        user,
        maxTokens,
      }),
    });

    if (!res.ok) {
      const errorText = await res.text();
      console.error("Edge function error:", errorText);

      if (res.status === 401) {
        return "Your session expired. Please login again.";
      }

      return `Error from AI: ${errorText}`;
    }

    const data = await res.json();
    return data.content?.[0]?.text || "";

  } catch (e) {
    console.error("Error calling Claude:", e);
    return "Error connecting to AI. Please check your configuration.";
  }
}

function AuthModal({ mode: initialMode, onClose }) {
  const [mode, setMode] = useState(initialMode || 'signup');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');

  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');

  const handleEmail = async (e) => {
    e.preventDefault();
    setLoading(true); setError(''); setSuccess('');
    try {
      if (mode === 'signup') {
        const { error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
        if (error) throw error;
        setSuccess('Account created! Check your email to confirm.');

        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onClose();
      }

    setLoading(false);
  };

          {success && <p style={{color:'#10B981',fontSize:13,background:'#F0FDF4',padding:'10px 12px',borderRadius:8}}>{success}</p>}
          <button type="submit" disabled={loading} style={{width:'100%',padding:'13px',borderRadius:10,background:loading?'#ccc':'var(--accent)',color:'white',border:'none',fontWeight:600,fontSize:15,marginTop:4}}>
            {loading ? 'Please wait...' : mode==='signup' ? 'Create free account' : 'Log in'}

        </form>

        <p style={{textAlign:'center',marginTop:20,fontSize:14,color:'var(--muted)'}}>
          {mode==='signup' ? 'Already have an account? ' : "Don't have an account? "}
          <button onClick={()=>setMode(mode==='signup'?'login':'signup')} style={{background:'none',border:'none',color:'var(--accent)',fontWeight:600,fontSize:14}}>

        </p>

        {mode==='signup' && <p style={{textAlign:'center',marginTop:12,fontSize:11,color:'var(--muted)'}}>By signing up, you agree to our Terms of Service and Privacy Policy.</p>}
      </div>
    </div>
  );
}

const SERVICES = ['Web Design','Social Media Management','Copywriting','Video Editing','SEO','Branding','App Development','Other'];
const TAGS = ['Hot Lead','Follow Up','Interested','Not Ready','Converted'];

const dInp = {background:'#0C0F14',border:'1px solid #1E2433',borderRadius:8,color:'#E8EAF0',padding:'10px 14px',fontSize:13,fontFamily:"'Poppins',sans-serif",outline:'none',width:'100%',boxSizing:'border-box'};
const dCard = {background:'#111520',border:'1px solid #1E2433',borderRadius:12,padding:18,marginBottom:4};
const dBtn = {background:'#16A34A',border:'none',borderRadius:8,color:'#0C0F14',padding:'9px 18px',fontSize:13,fontFamily:"'Poppins',sans-serif",fontWeight:600,cursor:'pointer'};
const dLabel = {color:'#4B5563',fontFamily:"Instrument serif",fontSize:11,letterSpacing:1,textTransform:'uppercase',marginBottom:6,marginTop:0,display:'block'};

function LeadsTab({ user }) {
  const [leads, setLeads] = useState([]);
  const [form, setForm] = useState({name:'',handle:'',niche:'',pain:'',service:SERVICES[0],tag:TAGS[0],notes:''});
  const [adding, setAdding] = useState(false);
  const [search, setSearch] = useState('');
  const [filterTag, setFilterTag] = useState('All');
  const [dbLoading, setDbLoading] = useState(true);

  useEffect(() => {
    loadLeads();
  }, []);

  const loadLeads = async () => {
    setDbLoading(true);
    const { data } = await sb.from('leads').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    setLeads(data || []);
    setDbLoading(false);
  };

  const addLead = async () => {
    if (!form.name || !form.handle) return;
    const { data, error } = await sb.from('leads').insert([{ ...form, user_id: user.id }]).select();
    if (!error && data) { setLeads(p => [data[0], ...p]); setForm({name:'',handle:'',niche:'',pain:'',service:SERVICES[0],tag:TAGS[0],notes:''}); setAdding(false); }
  };

  const updateTag = async (id, tag) => {
    await sb.from('leads').update({ tag }).eq('id', id);
    setLeads(p => p.map(l => l.id === id ? { ...l, tag } : l));
  };

  const deleteLead = async (id) => {
    await sb.from('leads').delete().eq('id', id);
    setLeads(p => p.filter(l => l.id !== id));
  };

  const filtered = leads.filter(l => (filterTag==='All'||l.tag===filterTag) && (l.name?.toLowerCase().includes(search.toLowerCase())||l.handle?.toLowerCase().includes(search.toLowerCase())));

  return (
    <div>
      <div style={{display:'flex',gap:10,marginBottom:18,flexWrap:'wrap',alignItems:'center'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search leads..." style={{...dInp,width:200}}/>
        <select value={filterTag} onChange={e=>setFilterTag(e.target.value)} style={{...dInp,width:'auto'}}>
          <option>All</option>{TAGS.map(t=><option key={t}>{t}</option>)}
        </select>
        <button onClick={()=>setAdding(!adding)} style={dBtn}>{adding?'✕ Cancel':'+ Add Lead'}</button>
      </div>

      {adding && (
        <div style={{...dCard,marginBottom:16}}>
          <p style={dLabel}>New Lead</p>
          <div className="r-grid2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
            <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Full Name *" style={dInp}/>
            <input value={form.handle} onChange={e=>setForm(f=>({...f,handle:e.target.value}))} placeholder="@threads_handle *" style={dInp}/>
            <input value={form.niche} onChange={e=>setForm(f=>({...f,niche:e.target.value}))} placeholder="Niche (e.g. Fitness)" style={dInp}/>
            <input value={form.pain} onChange={e=>setForm(f=>({...f,pain:e.target.value}))} placeholder="Pain point observed" style={dInp}/>
            <select value={form.service} onChange={e=>setForm(f=>({...f,service:e.target.value}))} style={dInp}>{SERVICES.map(s=><option key={s}>{s}</option>)}</select>
            <select value={form.tag} onChange={e=>setForm(f=>({...f,tag:e.target.value}))} style={dInp}>{TAGS.map(t=><option key={t}>{t}</option>)}</select>
          </div>
          <textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} placeholder="Notes (optional)" rows={2} style={{...dInp,resize:'vertical'}}/>
          <button onClick={addLead} style={{...dBtn,marginTop:10}}>Save Lead</button>
        </div>
      )}

      {dbLoading && <div style={{color:'#4B5563',fontSize:13,fontFamily:"'IBM Plex Mono',monospace",padding:'20px 0'}}>Loading leads...</div>}

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {!dbLoading && filtered.length===0 && <p style={{color:'#4B5563',fontFamily:"'IBM Plex Mono',monospace",fontSize:13,padding:'20px 0'}}>No leads yet. Add your first prospect from Threads.</p>}
        {filtered.map(lead => (
          <div key={lead.id} style={{...dCard,display:'flex',gap:14,alignItems:'flex-start',flexWrap:'wrap'}}>
            <div style={{width:40,height:40,borderRadius:'50%',background:'#1E2433',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0,color:'#9CA3AF',border:'1.5px solid #2D3748'}}>{lead.name?.[0]}</div>
            <div style={{flex:1,minWidth:0,width:'100%'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:6}}>
                <div>
                  <span style={{fontFamily:"'Instrument Serif',serif",fontSize:16,color:'#F3F4F6'}}>{lead.name}</span>
                  <span style={{color:'#6B7280',fontFamily:"'IBM Plex Mono',monospace",fontSize:12,marginLeft:8}}>{lead.handle}</span>
                </div>
                <div style={{display:'flex',gap:6,alignItems:'center'}}>
                  <span style={{background:TAG_COLORS[lead.tag]+'22',color:TAG_COLORS[lead.tag],border:`1px solid ${TAG_COLORS[lead.tag]}55`,borderRadius:4,padding:'2px 8px',fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>{lead.tag}</span>
                  <button onClick={()=>deleteLead(lead.id)} style={{background:'none',border:'none',color:'#4B5563',cursor:'pointer',fontSize:18,lineHeight:1}}>×</button>
                </div>
              </div>
              <div style={{display:'flex',gap:8,marginTop:6,flexWrap:'wrap'}}>
                {lead.niche && <span style={{background:'#1E2433',color:'#9CA3AF',borderRadius:4,padding:'2px 8px',fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>{lead.niche}</span>}
                <span style={{background:'#1e3a5f22',color:'#60a5fa',borderRadius:4,padding:'2px 8px',fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>{lead.service}</span>
              </div>
              {lead.pain && <p style={{color:'#6B7280',fontSize:13,marginTop:6,fontStyle:'italic'}}>"{lead.pain}"</p>}
              <select value={lead.tag} onChange={e=>updateTag(lead.id,e.target.value)} style={{...dInp,fontSize:12,padding:'4px 8px',width:'auto',marginTop:8}}>
                {TAGS.map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function OnboardingTab({user,profile}) {
  const [clientName, setClientName] = useState('');
  const [service, setService] = useState(SERVICES[0]);
  const [ctx, setCtx] = useState('');
  const [questions, setQuestions] = useState([]);
  const [answers, setAnswers] = useState({});
  const [loading, setLoading] = useState(false);
  const [copied, setCopied] = useState(false);

  const generate = async () => {
    setLoading(true); setQuestions([]); setAnswers({});
    const { allowed, used } = await checkAndIncrementUsage(user.id, profile?.plan);
     if (!allowed) {
    setOutput(`You've used all ${TRIAL_LIMIT} free generations. Upgrade to Pro for unlimited access.`);
    setLoading(false);
    return;
    }
    const sys = `You are a professional freelance consultant. Generate a concise onboarding questionnaire. Output ONLY a JSON array of 7 question strings. No intro, no markdown, no explanation. Raw JSON array only.`;
    const usr = `Service: ${service}\nClient: ${clientName||'the client'}\nContext: ${ctx||'none'}\n\nGenerate 7 smart onboarding questions to accurately scope the project.`;
    const r = await callClaude(sys, usr, 500);
    try {
      const clean = r.replace(/```json|```/g,'').trim();
      setQuestions(JSON.parse(clean));
    } catch {
      const lines = r.split('\n').filter(l=>l.trim().length>10).map(l=>l.replace(/^\d+\.\s*/,'').replace(/^[-•"]\s*/,'').replace(/"$/,''));
      setQuestions(lines.slice(0,8));
    }
    setLoading(false);
  };

  const copyQ = () => {
    const t = `Hi ${clientName||'there'}! To kick off your project, could you answer these quick questions?\n\n` + questions.map((q,i)=>`${i+1}. ${q}`).join('\n');
    navigator.clipboard.writeText(t); setCopied(true); setTimeout(()=>setCopied(false),2000);
  };

  return (
    <div>
      <div className="r-grid2" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:12}}>
        <div>
          <label style={dLabel}>Client Name</label>
          <input value={clientName} onChange={e=>setClientName(e.target.value)} placeholder="e.g. Sarah Johnson" style={dInp}/>
        </div>
        <div>
          <label style={dLabel}>Service Type</label>
          <select value={service} onChange={e=>setService(e.target.value)} style={dInp}>{SERVICES.map(s=><option key={s}>{s}</option>)}</select>
        </div>
      </div>
      <label style={dLabel}>Extra Context (optional)</label>
      <textarea value={ctx} onChange={e=>setCtx(e.target.value)} placeholder="e.g. They sell handmade jewelry and want to grow on social media" rows={2} style={{...dInp,resize:'vertical',marginBottom:14}}/>
      <button onClick={generate} disabled={loading} style={{...dBtn,marginBottom:16}}>
        {loading?'Generating...':'✦ Generate Questions'}
      </button>
      {loading && <Spinner/>}
      {questions.length>0 && (
        <div style={dCard}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <label style={{...dLabel,margin:0}}>Onboarding Questions for {clientName||'Client'}</label>
            <button onClick={copyQ} style={{...dBtn,fontSize:11,padding:'5px 12px',display:'flex',alignItems:'center',gap:6}}>
              {copied?<><Icon.check/>Copied!</>:'Copy to Send'}
            </button>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {questions.map((q,i)=>(
              <div key={i}>
                <p style={{color:'#E5E7EB',fontSize:13,marginBottom:6,fontFamily:"'IBM Plex Mono',monospace"}}>
                  <span style={{color:'#F59E0B'}}>{String(i+1).padStart(2,'0')}.</span> {q}
                </p>
                <textarea value={answers[i]||''} onChange={e=>setAnswers(p=>({...p,[i]:e.target.value}))} placeholder="Client's answer goes here..." rows={2} style={{...dInp,resize:'vertical',fontSize:12,lineHeight:1.6}}/>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

          </div>
        ))}
      </div>

      <button onClick={generate} disabled={loading} style={{...dBtn,marginBottom:16}}>
        {loading?'Generating...':'◈ Generate Project Scope'}

      {loading && <Spinner/>}

      {scope && (
        <div style={dCard}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <label style={{...dLabel,margin:0}}>Project Scope — {clientName||'Client'}</label>

  );

// ─── MINI BAR CHART (pure CSS, no library needed) ──────────────────────────
function MiniBarChart({ data, color = '#16A34A', label = 'Value' }) {
  const max = Math.max(...data.map(d => d.value), 1);
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: 80 }}>
      {data.map((d, i) => (
        <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, height: '100%', justifyContent: 'flex-end' }}>
          <div
            style={{
              width: '100%', borderRadius: '4px 4px 0 0',
              background: color,
              height: `${Math.max((d.value / max) * 64, d.value > 0 ? 6 : 2)}px`,
              opacity: d.value === 0 ? 0.2 : 0.9,
              transition: 'height 0.4s ease',
              position: 'relative',
            }}
            title={`${d.label}: ${d.value}`}
          />
          <span style={{ fontSize: 9, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace", whiteSpace: 'nowrap' }}>{d.label}</span>
        </div>
      ))}
    </div>
  );
}

// ─── MINI LINE CHART (SVG sparkline) ───────────────────────────────────────
function SparkLine({ data, color = '#16A34A', height = 60 }) {
  if (!data || data.length < 2) return <div style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#4B5563', fontSize: 12 }}>Not enough data yet</div>;
  const max = Math.max(...data, 1);
  const w = 300; const h = height;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - (v / max) * (h - 8) - 4;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height }} preserveAspectRatio="none">
      <defs>
        <linearGradient id={`sg-${color.replace('#','')}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polyline fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" points={pts} />
      <polygon fill={`url(#sg-${color.replace('#','')})`} points={`0,${h} ${pts} ${w},${h}`} />
    </svg>
  );
}

// ─── STAT CARD ──────────────────────────────────────────────────────────────
function StatCard({ label, value, sub, icon, color = '#16A34A', blurred = false }) {
  return (
    <div style={{ background: '#111520', borderRadius: 12, padding: '18px 20px', border: '1px solid #1A2030', position: 'relative', overflow: 'hidden' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
        <span style={{ fontSize: 11, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace", letterSpacing: 1, textTransform: 'uppercase' }}>{label}</span>
        <span style={{ color }}>{icon}</span>
      </div>
      <div style={{ filter: blurred ? 'blur(8px)' : 'none', userSelect: blurred ? 'none' : 'auto' }}>
        <div style={{ fontSize: 30, fontFamily: "'Instrument Serif', serif", color: '#E8EAF0', lineHeight: 1, marginBottom: 4 }}>{value}</div>
        {sub && <div style={{ fontSize: 12, color: '#6B7280' }}>{sub}</div>}
      </div>
    </div>
  );
}

// ─── FUNNEL STAGE ───────────────────────────────────────────────────────────
function FunnelStage({ label, count, pct, color, isLast, dropOff }) {
  const width = Math.max(pct, 8);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 0 }}>
      <div style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 12, marginBottom: 4 }}>
        <div style={{ flex: 1, height: 44, background: color, borderRadius: 8, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 16px', width: `${width}%`, margin: '0 auto', transition: 'width 0.5s ease' }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: '#0B0F17', fontFamily: "'Poppins', sans-serif" }}>{label}</span>
          <span style={{ fontSize: 13, fontWeight: 700, color: '#0B0F17', fontFamily: "'IBM Plex Mono', monospace" }}>{count}</span>
        </div>
        <div style={{ width: 60, textAlign: 'right' }}>
          <span style={{ fontSize: 13, color: '#E8EAF0', fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}>{pct}%</span>
        </div>
      </div>
      {!isLast && dropOff !== null && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '4px 0', width: '100%' }}>
          <div style={{ flex: 1, height: 1, background: '#1A2030' }} />
          <span style={{ fontSize: 11, color: '#EF4444', fontFamily: "'IBM Plex Mono', monospace", whiteSpace: 'nowrap' }}>↓ {dropOff}% drop-off</span>
          <div style={{ flex: 1, height: 1, background: '#1A2030' }} />
        </div>
      )}
    </div>
  );
}

// ─── CLOSE DEAL MODAL ───────────────────────────────────────────────────────
function CloseDealModal({ leads, userId, onClose, onSaved }) {
  const [selectedId, setSelectedId] = useState(leads[0]?.id || '');
  const [value, setValue] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const openLeads = leads.filter(l => l.tag !== 'Converted');

  const save = async () => {
    if (!selectedId || !value || isNaN(parseFloat(value))) {
      setError('Select a lead and enter a valid deal value.'); return;
    }
    setLoading(true);
    const { error: err } = await sb.from('leads').update({
      tag: 'Converted',
      deal_value: parseFloat(value),
      closed_at: new Date().toISOString(),
    }).eq('id', selectedId).eq('user_id', userId);
    if (err) { setError(err.message); setLoading(false); return; }
    onSaved(); onClose();
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, backdropFilter: 'blur(4px)' }} onClick={onClose}>
      <div style={{ background: '#111520', border: '1px solid #1A2030', borderRadius: 16, padding: 28, width: '100%', maxWidth: 400 }} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontFamily: "'Instrument Serif', serif", fontSize: 22, color: '#E8EAF0', marginBottom: 6 }}>Mark Deal Closed</h3>
        <p style={{ color: '#6B7280', fontSize: 13, marginBottom: 20 }}>This will tag the lead as Converted and log the revenue.</p>
        <label style={dLabel}>Lead</label>
        <select value={selectedId} onChange={e => setSelectedId(e.target.value)} style={{ ...dInp, marginBottom: 14 }}>
          {openLeads.map(l => <option key={l.id} value={l.id}>{l.name} — {l.handle}</option>)}
          {leads.filter(l => l.tag === 'Converted').map(l => <option key={l.id} value={l.id} disabled>✓ {l.name} (already closed)</option>)}
        </select>
        <label style={dLabel}>Deal Value (USD)</label>
        <input value={value} onChange={e => setValue(e.target.value)} placeholder="e.g. 350" type="number" min="0" style={{ ...dInp, marginBottom: 14 }} />
        {error && <p style={{ color: '#EF4444', fontSize: 12, marginBottom: 10, background: '#1A0808', padding: '8px 12px', borderRadius: 6 }}>{error}</p>}
        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
          <button onClick={onClose} style={{ flex: 1, padding: '10px', borderRadius: 8, border: '1px solid #1A2030', background: 'transparent', color: '#9CA3AF', fontSize: 14 }}>Cancel</button>
          <button onClick={save} disabled={loading} style={{ ...dBtn, flex: 1, padding: '10px', fontSize: 14, opacity: loading ? 0.6 : 1 }}>
            {loading ? 'Saving...' : '✓ Confirm Close'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── REPLY TRACKER MODAL ────────────────────────────────────────────────────
function ReplyTrackerModal({ leads, userId, onClose, onSaved }) {
  const [selectedId, setSelectedId] = useState(leads[0]?.id || '');
  const [isPositive, setIsPositive] = useState(true);
  const [loading, setLoading] = useState(false);

  const save = async () => {
    if (!selectedId) return;
    setLoading(true);
    await sb.from('leads').update({
      has_replied: true,
      is_positive_reply: isPositive,
    }).eq('id', selectedId).eq('user_id', userId);
    onSaved(); onClose();
  };

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.7)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, backdropFilter: 'blur(4px)' }} onClick={onClose}>
      <div style={{ background: '#111520', border: '1px solid #1A2030', borderRadius: 16, padding: 28, width: '100%', maxWidth: 400 }} onClick={e => e.stopPropagation()}>
        <h3 style={{ fontFamily: "'Instrument Serif', serif", fontSize: 22, color: '#E8EAF0', marginBottom: 6 }}>Log a Reply</h3>
        <p style={{ color: '#6B7280', fontSize: 13, marginBottom: 20 }}>Track when a prospect replies to your outreach.</p>
        <label style={dLabel}>Lead who replied</label>
        <select value={selectedId} onChange={e => setSelectedId(e.target.value)} style={{ ...dInp, marginBottom: 14 }}>
          {leads.map(l => <option key={l.id} value={l.id}>{l.name} — {l.handle}</option>)}
        </select>
        <label style={dLabel}>Reply type</label>
        <div style={{ display: 'flex', gap: 10, marginBottom: 20 }}>
          <button onClick={() => setIsPositive(true)} style={{ flex: 1, padding: '10px', borderRadius: 8, border: `1.5px solid ${isPositive ? '#16A34A' : '#1A2030'}`, background: isPositive ? '#16A34A18' : 'transparent', color: isPositive ? '#16A34A' : '#6B7280', fontSize: 13, fontWeight: 600 }}>
            👍 Positive
          </button>
          <button onClick={() => setIsPositive(false)} style={{ flex: 1, padding: '10px', borderRadius: 8, border: `1.5px solid ${!isPositive ? '#EF4444' : '#1A2030'}`, background: !isPositive ? '#EF444418' : 'transparent', color: !isPositive ? '#EF4444' : '#6B7280', fontSize: 13, fontWeight: 600 }}>
            👎 Negative
          </button>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <button onClick={onClose} style={{ flex: 1, padding: '10px', borderRadius: 8, border: '1px solid #1A2030', background: 'transparent', color: '#9CA3AF', fontSize: 14 }}>Cancel</button>
          <button onClick={save} disabled={loading} style={{ ...dBtn, flex: 1, padding: '10px', fontSize: 14 }}>
            {loading ? 'Saving...' : 'Log Reply'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  MAIN ANALYTICS TAB COMPONENT
// ═══════════════════════════════════════════════════════
function AnalyticsTab({ user, profile, onShowPricing }) {
  const isPro = profile?.plan === 'monthly' || profile?.plan === 'yearly';

  const [leads, setLeads] = useState([]);
  const [outreachEvents, setOutreachEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showCloseDeal, setShowCloseDeal] = useState(false);
  const [showReplyTracker, setShowReplyTracker] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);

  useEffect(() => {
    if (!isPro) { setLoading(false); return; }
    loadData();
  }, [isPro, refreshKey]);

  const loadData = async () => {
    setLoading(true);
    const [leadsRes, eventsRes] = await Promise.all([
      sb.from('leads').select('*').eq('user_id', user.id).order('created_at', { ascending: false }),
      sb.from('outreach_events').select('*').eq('user_id', user.id).order('sent_at', { ascending: false }),
    ]);
    setLeads(leadsRes.data || []);
    setOutreachEvents(eventsRes.data || []);
    setLoading(false);
  };

  const refresh = () => setRefreshKey(k => k + 1);

  // ── OUTREACH METRICS ────────────────────────────────
  const totalSent = outreachEvents.filter(e => e.type === 'dm' || e.type === 'email').length;
  const totalFollowUps = outreachEvents.filter(e => e.type === 'followup').length;
  const totalReplies = leads.filter(l => l.has_replied).length;
  const positiveReplies = leads.filter(l => l.is_positive_reply).length;
  const replyRate = totalSent > 0 ? ((totalReplies / totalSent) * 100).toFixed(1) : '0.0';

  // ── WEEKLY CHART (last 7 days) ───────────────────────
  const weeklyData = Array.from({ length: 7 }, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (6 - i));
    const dayStr = d.toISOString().split('T')[0];
    const label = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
    const value = outreachEvents.filter(e => e.sent_at?.startsWith(dayStr)).length;
    return { label, value };
  });

  // ── MONTHLY REVENUE CHART (last 6 months) ───────────
  const monthlyRevenue = Array.from({ length: 6 }, (_, i) => {
    const d = new Date();
    d.setMonth(d.getMonth() - (5 - i));
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const label = d.toLocaleString('default', { month: 'short' });
    const value = leads
      .filter(l => l.closed_at && l.deal_value)
      .filter(l => {
        const cd = new Date(l.closed_at);
        return cd.getFullYear() === y && (cd.getMonth() + 1) === m;
      })
      .reduce((sum, l) => sum + (l.deal_value || 0), 0);
    return { label, value };
  });

  // ── REVENUE METRICS ──────────────────────────────────
  const closedLeads = leads.filter(l => l.closed_at && l.deal_value);
  const totalRevenue = closedLeads.reduce((s, l) => s + (l.deal_value || 0), 0);
  const now = new Date();
  const thisMonthRevenue = closedLeads
    .filter(l => {
      const d = new Date(l.closed_at);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    })
    .reduce((s, l) => s + (l.deal_value || 0), 0);
  const avgDealSize = closedLeads.length > 0 ? (totalRevenue / closedLeads.length).toFixed(0) : 0;

  // ── FUNNEL DATA ──────────────────────────────────────
  const totalLeads = leads.length;
  const repliedLeads = leads.filter(l => l.has_replied).length;
  const dealsClosedCount = leads.filter(l => l.tag === 'Converted').length;

  const funnelStages = [
    {
      label: 'Total Leads',
      count: totalLeads,
      pct: 100,
      color: '#16A34A',
    },
    {
      label: 'Replied',
      count: repliedLeads,
      pct: totalLeads > 0 ? Math.round((repliedLeads / totalLeads) * 100) : 0,
      color: '#2563EB',
      dropOff: totalLeads > 0 ? Math.round(((totalLeads - repliedLeads) / totalLeads) * 100) : 0,
    },
    {
      label: 'Deals Closed',
      count: dealsClosedCount,
      pct: totalLeads > 0 ? Math.round((dealsClosedCount / totalLeads) * 100) : 0,
      color: '#7C3AED',
      dropOff: repliedLeads > 0 ? Math.round(((repliedLeads - dealsClosedCount) / repliedLeads) * 100) : 0,
    },
  ];

  // ── LOCKED STATE ─────────────────────────────────────
  if (!isPro) {
    return (
      <div style={{ position: 'relative', minHeight: 500 }}>
        {/* Blurred preview behind lock */}
        <div style={{ filter: 'blur(6px)', pointerEvents: 'none', userSelect: 'none', opacity: 0.4 }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginBottom: 20 }}>
            {['Total Sent', 'Reply Rate', 'Deals Closed', 'Revenue'].map(l => (
              <StatCard key={l} label={l} value="—" color="#16A34A" icon={<AnalyticsIcons.chart />} />
            ))}
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 20 }}>
            <div style={{ background: '#111520', borderRadius: 12, padding: 20, border: '1px solid #1A2030', height: 160 }} />
            <div style={{ background: '#111520', borderRadius: 12, padding: 20, border: '1px solid #1A2030', height: 160 }} />
          </div>
        </div>

        {/* Lock overlay */}
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
          <div style={{ background: '#111520', border: '1px solid #1A2030', borderRadius: 20, padding: '40px 48px', textAlign: 'center', maxWidth: 380 }}>
            <div style={{ color: '#16A34A', marginBottom: 16 }}><AnalyticsIcons.lock /></div>
            <h3 style={{ fontFamily: "'Instrument Serif', serif", fontSize: 24, color: '#E8EAF0', marginBottom: 8 }}>Analytics (Pro)</h3>
            <p style={{ color: '#6B7280', fontSize: 14, lineHeight: 1.7, marginBottom: 24 }}>
              Upgrade to Pro to unlock your outreach metrics, sales funnel, and revenue tracker.
            </p>
            <button onClick={onShowPricing} style={{ ...dBtn, width: '100%', padding: '13px', fontSize: 15 }}>
              Upgrade to Pro →
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (loading) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 60, gap: 12, color: '#6B7280', fontSize: 14 }}>
      <div style={{ width: 18, height: 18, border: '2px solid #16A34A', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} />
      Loading analytics...
    </div>
  );

  return (
    <div>
      {/* ── ACTION BUTTONS ── */}
      <div style={{ display: 'flex', gap: 10, marginBottom: 24, flexWrap: 'wrap' }}>
        <button onClick={() => setShowReplyTracker(true)} style={{ ...dBtn, background: '#2563EB', display: 'flex', alignItems: 'center', gap: 7, fontSize: 13 }}>
          <AnalyticsIcons.reply /> Log Reply
        </button>
        <button onClick={() => setShowCloseDeal(true)} style={{ ...dBtn, background: '#16A34A', display: 'flex', alignItems: 'center', gap: 7, fontSize: 13 }}>
          <AnalyticsIcons.dollar /> Mark Deal Closed
        </button>
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 6, color: '#4B5563', fontSize: 12, fontFamily: "'IBM Plex Mono', monospace" }}>
          <span style={{ width: 8, height: 8, background: '#16A34A', borderRadius: '50%', display: 'inline-block', boxShadow: '0 0 6px #16A34A' }} />
          Live data
        </div>
      </div>

      {/* ── TOP STAT CARDS ── */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 12, marginBottom: 24 }}>
        <StatCard label="Total Sent" value={totalSent} sub={`${totalFollowUps} follow-ups`} icon={<AnalyticsIcons.send />} color="#16A34A" />
        <StatCard label="Replies" value={totalReplies} sub={`${positiveReplies} positive`} icon={<AnalyticsIcons.reply />} color="#2563EB" />
        <StatCard label="Reply Rate" value={`${replyRate}%`} sub={`${totalSent} outreach sent`} icon={<AnalyticsIcons.trend />} color="#F59E0B" />
        <StatCard label="Deals Closed" value={dealsClosedCount} sub={`Avg $${avgDealSize}`} icon={<AnalyticsIcons.funnel />} color="#7C3AED" />
        <StatCard label="Total Revenue" value={`$${totalRevenue.toLocaleString()}`} sub={`$${thisMonthRevenue.toLocaleString()} this month`} icon={<AnalyticsIcons.dollar />} color="#16A34A" />
      </div>

      {/* ── MIDDLE ROW: Funnel + Weekly Chart ── */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 16, marginBottom: 16 }}>

        {/* Sales Funnel */}
        <div style={{ background: '#111520', borderRadius: 12, padding: 20, border: '1px solid #1A2030' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
            <div>
              <p style={{ ...dLabel, margin: 0 }}>Sales Funnel</p>
              <p style={{ color: '#6B7280', fontSize: 12, marginTop: 3 }}>Lead → Reply → Closed</p>
            </div>
            <span style={{ color: '#16A34A' }}><AnalyticsIcons.funnel /></span>
          </div>
          {totalLeads === 0 ? (
            <div style={{ textAlign: 'center', padding: '32px 0', color: '#4B5563', fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>
              Add leads to see your funnel
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
              {funnelStages.map((stage, i) => (
                <FunnelStage
                  key={stage.label}
                  label={stage.label}
                  count={stage.count}
                  pct={stage.pct}
                  color={stage.color}
                  isLast={i === funnelStages.length - 1}
                  dropOff={stage.dropOff ?? null}
                />
              ))}
            </div>
          )}
        </div>

        {/* Weekly Outreach Chart */}
        <div style={{ background: '#111520', borderRadius: 12, padding: 20, border: '1px solid #1A2030' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
            <div>
              <p style={{ ...dLabel, margin: 0 }}>Weekly Outreach</p>
              <p style={{ color: '#6B7280', fontSize: 12, marginTop: 3 }}>DMs + emails sent (last 7 days)</p>
            </div>
            <span style={{ color: '#F59E0B' }}><AnalyticsIcons.chart /></span>
          </div>
          <SparkLine data={weeklyData.map(d => d.value)} color="#F59E0B" height={70} />
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8 }}>
            {weeklyData.map(d => (
              <span key={d.label} style={{ fontSize: 9, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace", flex: 1, textAlign: 'center' }}>{d.label}</span>
            ))}
          </div>
          <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid #1A2030', display: 'flex', justifyContent: 'space-between' }}>
            <span style={{ fontSize: 12, color: '#6B7280' }}>This week total</span>
            <span style={{ fontSize: 14, color: '#E8EAF0', fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}>
              {weeklyData.reduce((s, d) => s + d.value, 0)} sent
            </span>
          </div>
        </div>

      </div>

      {/* ── BOTTOM: Monthly Revenue Chart ── */}
      <div style={{ background: '#111520', borderRadius: 12, padding: 20, border: '1px solid #1A2030', marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <div>
            <p style={{ ...dLabel, margin: 0 }}>Monthly Revenue</p>
            <p style={{ color: '#6B7280', fontSize: 12, marginTop: 3 }}>Closed deals — last 6 months</p>
          </div>
          <div style={{ textAlign: 'right' }}>
            <p style={{ fontFamily: "'Instrument Serif', serif", fontSize: 22, color: '#16A34A', lineHeight: 1 }}>${totalRevenue.toLocaleString()}</p>
            <p style={{ fontSize: 11, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace" }}>total revenue</p>
          </div>
        </div>
        {closedLeads.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '32px 0', color: '#4B5563', fontSize: 13, fontFamily: "'IBM Plex Mono', monospace" }}>
            Close your first deal to see revenue charts →{' '}
            <button onClick={() => setShowCloseDeal(true)} style={{ background: 'none', border: 'none', color: '#16A34A', cursor: 'pointer', fontSize: 13, textDecoration: 'underline' }}>
              Mark deal closed
            </button>
          </div>
        ) : (
          <MiniBarChart data={monthlyRevenue} color="#16A34A" />
        )}

        {/* Monthly summary row */}
        {closedLeads.length > 0 && (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12, marginTop: 16, paddingTop: 16, borderTop: '1px solid #1A2030' }}>
            <div>
              <p style={{ fontSize: 11, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace", marginBottom: 4 }}>THIS MONTH</p>
              <p style={{ fontSize: 18, fontFamily: "'Instrument Serif', serif", color: '#E8EAF0' }}>${thisMonthRevenue.toLocaleString()}</p>
            </div>
            <div>
              <p style={{ fontSize: 11, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace", marginBottom: 4 }}>AVG DEAL SIZE</p>
              <p style={{ fontSize: 18, fontFamily: "'Instrument Serif', serif", color: '#E8EAF0' }}>${avgDealSize}</p>
            </div>
            <div>
              <p style={{ fontSize: 11, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace", marginBottom: 4 }}>DEALS CLOSED</p>
              <p style={{ fontSize: 18, fontFamily: "'Instrument Serif', serif", color: '#E8EAF0' }}>{dealsClosedCount}</p>
            </div>
          </div>
        )}
      </div>

      {/* ── RECENT CLOSED DEALS TABLE ── */}
      {closedLeads.length > 0 && (
        <div style={{ background: '#111520', borderRadius: 12, padding: 20, border: '1px solid #1A2030' }}>
          <p style={{ ...dLabel, marginBottom: 14 }}>Recent Closed Deals</p>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {closedLeads.slice(0, 5).map(lead => (
              <div key={lead.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 14px', background: '#0B0F17', borderRadius: 8, border: '1px solid #1A2030' }}>
                <div>
                  <p style={{ fontFamily: "'Instrument Serif', serif", fontSize: 14, color: '#E8EAF0', marginBottom: 2 }}>{lead.name}</p>
                  <p style={{ fontSize: 11, color: '#4B5563', fontFamily: "'IBM Plex Mono', monospace" }}>
                    {lead.service} · {lead.closed_at ? new Date(lead.closed_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'}
                  </p>
                </div>
                <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, color: '#16A34A', fontWeight: 600 }}>
                  ${lead.deal_value?.toLocaleString()}
                </span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Modals */}
      {showCloseDeal && (
        <CloseDealModal
          leads={leads}
          userId={user.id}
          onClose={() => setShowCloseDeal(false)}
          onSaved={refresh}
        />
      )}
      {showReplyTracker && (
        <ReplyTrackerModal
          leads={leads}
          userId={user.id}
          onClose={() => setShowReplyTracker(false)}
          onSaved={refresh}
        />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════════════════
function Dashboard({ user, profile, onLogout, onUpgrade, onShowPricing }) {
  const [tab, setTab] = useState('leads');
  const [showBanner, setShowBanner] = useState(false);

  const daysLeft = trialDaysLeft(profile);
  const isPaid = profile?.plan === 'monthly' || profile?.plan === 'yearly';
  const isExpired = !isPaid && daysLeft === 0;

  useEffect(() => {
    // Show trial countdown banner once per session
    const shown = sessionStorage.getItem('banner_shown');
    if (!shown && !isPaid) {
      setShowBanner(true);
      sessionStorage.setItem('banner_shown', '1');
    }
  }, []);

  const userName = user.user_metadata?.full_name || user.email?.split('@')[0] || 'there';
  const tabs = [
    { id:'leads', label:'Leads', icon:<Icon.leads/> },
    { id:'outreach', label:'Outreach', icon:<Icon.outreach/> },
    { id:'onboarding', label:'Onboard', icon:<Icon.onboard/> },
    { id:'scope', label:'Scope Builder', icon:<Icon.scope/> },
    { id:'analytics', label:'Analytics (Pro)', icon:<Icon.analytics/> },
  ];

  if (isExpired) {
    return (
      <div style={{minHeight:'100vh',background:'var(--dash-bg)',display:'flex',alignItems:'center',justifyContent:'center',padding:24}}>
        <div style={{textAlign:'center',maxWidth:480}}>
          <div style={{fontSize:48,marginBottom:16}}>⏰</div>
          <h2 style={{fontFamily:"'Instrument Serif',serif",fontSize:36,color:'#F3F4F6',marginBottom:12}}>Your free trial has ended.</h2>
          <p style={{color:'#6B7280',marginBottom:32,fontSize:16,lineHeight:1.6}}>You had a great run! Upgrade to Pro to keep your leads, outreach tools, and scope builder fully active.</p>
          <button onClick={onShowPricing} style={{...dBtn,padding:'14px 36px',fontSize:16,marginRight:12}}>See Plans →</button>
          <button onClick={onLogout} style={{background:'none',border:'1px solid #374151',borderRadius:8,color:'#9CA3AF',padding:'14px 24px',fontSize:14}}>Log out</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{minHeight:'100vh',background:'var(--dash-bg)',display:'flex',flexDirection:'column'}}>
      {/* Trial Banner (once per session) */}
      {showBanner && !isPaid && (
        <div className="r-banner" style={{background:daysLeft<=2?'#7F1D1D':'#1C1500',borderBottom:`1px solid ${daysLeft<=2?'#991B1B':'#374151'}`,padding:'10px 24px',display:'flex',alignItems:'center',justifyContent:'space-between',animation:'slideDown 0.3s ease'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{color:daysLeft<=2?'#FCA5A5':'#F59E0B'}}><Icon.clock/></span>
            <span style={{color:daysLeft<=2?'#FCA5A5':'#FDE68A',fontSize:13,fontWeight:500}}>
              {daysLeft} day{daysLeft!==1?'s':''} left on your free trial.{' '}
              <button onClick={()=>{setShowBanner(false);onShowPricing();}} style={{background:'none',border:'none',color:daysLeft<=2?'#F87171':'#F59E0B',fontWeight:600,fontSize:13,cursor:'pointer',textDecoration:'underline'}}>Upgrade to Pro →</button>
            </span>
          </div>
          <button onClick={()=>setShowBanner(false)} style={{background:'none',border:'none',color:'#6B7280',cursor:'pointer'}}><Icon.x/></button>
        </div>
      )}

      {/* Top Nav */}
      <nav className="r-nav" style={{background:'#0C0F14',borderBottom:'1px solid #1E2433',padding:'0 24px',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
        <div className="r-logo" style={{display:'flex',alignItems:'center',gap:12,height:60}}>
          <div><img style={{width:45,height:45,marginRight:8}} src="https://cdn.jsdelivr.net/gh/ShadyLabs-Web/shadylabs-assets@main/IMG-20260223-WA0003-removebg-preview.png" alt="ShadyLabs Image"></img> </div>
          <span style={{fontFamily:"'Instrument Serif',serif",fontSize:22,color:'#F3F4F6'}}>Katalyst</span>
        </div>

        <div className="r-tabs" style={{display:'flex',gap:2}}>
          {tabs.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{display:'flex',alignItems:'center',gap:7,padding:'8px 14px',borderRadius:8,border:'none',background:tab===t.id?'rgba(245,158,11,0.12)':'transparent',color:tab===t.id?'#F59E0B':'#6B7280',fontSize:13,fontWeight:500,borderBottom:`2px solid ${tab===t.id?'#F59E0B':'transparent'}`,cursor:'pointer',transition:'all 0.15s'}}>
              {t.icon} {t.label}
            </button>
          ))}
        </div>

        <div className="r-right" style={{display:'flex',alignItems:'center',gap:10}}>
          {!isPaid && (
            <button onClick={onShowPricing} style={{...dBtn,fontSize:12,padding:'6px 14px',display:'flex',alignItems:'center',gap:6}}>
              <Icon.zap/> Upgrade
            </button>
          )}
          {isPaid && <span className="r-probadge" style={{background:'rgba(16,185,129,0.12)',color:'#10B981',border:'1px solid rgba(16,185,129,0.3)',borderRadius:6,padding:'4px 10px',fontSize:11,fontFamily:"'IBM Plex Mono',monospace"}}>{profile.plan === 'monthly' ? 'PRO MONTHLY' : 'PRO YEARLY'}</span>}
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div style={{width:32,height:32,borderRadius:'50%',background:'#1E2433',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,color:'#9CA3AF',border:'1px solid #2D3748'}}>{userName[0]?.toUpperCase()}</div>
            <span className="r-uname" style={{color:'#9CA3AF',fontSize:13,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{userName}</span>
          </div>
          <button onClick={onLogout} style={{background:'none',border:'none',color:'#4B5563',cursor:'pointer',display:'flex',alignItems:'center',gap:5,fontSize:13}} title="Log out">
            <Icon.logout/>
          </button>
        </div>
      </nav>

      {/* Content */}
      <div className="r-content" style={{flex:1,padding:'28px 32px',maxWidth:1000,width:'100%',margin:'0 auto'}}>
        <div style={{marginBottom:24}}>
          <h1 style={{fontFamily:"'Instrument Serif',serif",fontSize:28,color:'#F3F4F6',marginBottom:4}}>
             {{ leads:'Lead Pipeline', outreach:'AI Outreach', onboarding:'Client Onboarding', scope:'Scope Builder', analytics:'Analytics (Pro)' }[tab]}
          </h1>
          <p style={{color:'#4B5563',fontSize:13}}>
             {{ leads:'Track & tag your Threads prospects', outreach:'Generate personalized DMs and cold emails', onboarding:'Create smart onboarding questionnaires', scope:'Build polished project scopes from client answers', analytics:'Your outreach performance, sales funnel, and revenue — in one view.' }[tab]}
          </p>
        </div>

        <div className="r-card" style={{background:'#111520',borderRadius:16,padding:24,border:'1px solid #1E2433',minHeight:400}}>
          {tab==='leads' && <LeadsTab user={user}/>}
          {tab==='outreach' && <OutreachTab user={user} profile={profile}/>}
          {tab==='onboarding' && <OnboardingTab user={user} profile={profile}/>}
          {tab==='scope' && <ScopeTab user={user} profile={profile}/>}
          {tab==='analytics' && <AnalyticsTab user={user} profile={profile} onShowPricing={onShowPricing}/>}
        </div>

        {!isPaid && daysLeft > 0 && (
          <div className="r-trialbar" style={{marginTop:16,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',background:'#111520',borderRadius:10,border:'1px solid #1E2433'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{display:'flex',gap:3}}>
                {Array.from({length:7}).map((_,i)=>(
                  <div key={i} style={{width:18,height:6,borderRadius:3,background:i<(7-daysLeft)?'#1E2433':'#F59E0B'}}/>
                ))}
              </div>
              <span style={{color:'#6B7280',fontSize:12,fontFamily:"'IBM Plex Mono',monospace"}}>{daysLeft} of {CONFIG.TRIAL_DAYS} days remaining</span>
            </div>
            <button onClick={onShowPricing} style={{background:'none',border:'1px solid #374151',borderRadius:6,color:'#9CA3AF',padding:'6px 14px',fontSize:12,cursor:'pointer'}}>View plans →</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  APP ROOT
// ═══════════════════════════════════════════════════════
function App() {
  const [page, setPage] = useState('landing');
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null);
  const [authMode, setAuthMode] = useState(null); // null | 'login' | 'signup'
  const [loading, setLoading] = useState(true);

useEffect(() => {
  // Hard fallback — never spin forever
  const fallback = setTimeout(() => setLoading(false), 5000);

  const { data: { subscription } } = sb.auth.onAuthStateChange(async (event, session) => {
    currentToken = session?.access_token || null;

    if (event === 'INITIAL_SESSION') {
      if (session?.user) {
        await handleUserSession(session.user);
      } else {
        setLoading(false);
      }
      clearTimeout(fallback);
    } else if (event === 'SIGNED_IN') {
      currentToken = session.access_token;
      await handleUserSession(session.user);
      setAuthMode(null);
    } else if (event === 'SIGNED_OUT') {
      setUser(null);
      setProfile(null);
      setPage('landing');
      setLoading(false);
    }
  });

  return () => {
    clearTimeout(fallback);
    subscription.unsubscribe();
  };
}, []);

const handleUserSession = async (u) => {
  setUser(u);
  try {
    const { data: prof } = await sb.from('profiles')
      .select('*').eq('id', u.id).single();
    if (!prof) {
      const { data: newProf } = await sb.from('profiles')
        .insert([{
          id: u.id,
          email: u.email,
          full_name: u.user_metadata?.full_name,
          trial_start: new Date().toISOString(),
          plan: 'trial',
          generations_used: 0,
          generations_reset_at: new Date().toISOString()
        }]).select().single();
      setProfile(newProf);
    } else {
      setProfile(prof);
    }
    setPage('dashboard');
  } catch(e) {
    setPage('landing');
  } finally {
    setLoading(false);
  }
};

const handleLogout = async () => {
  try {
    setUser(null);
    setProfile(null);
    setPage('landing');
    sessionStorage.removeItem('banner_shown');
    try {await sb.auth.signOut();} catch (e) {}
  } catch (error) {
    console.error('Logout error:', error);
    // Force it anyway
    setUser(null);
    setProfile(null);
    setPage('landing');
  }
};

  const showAuth = (mode) => { setAuthMode(mode); };

  if (loading) return (
    <div style={{minHeight:'100vh',background:'var(--dash-bg)',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:16}}>
      <div style={{width:36,height:36,background:'var(--accent)',borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontSize:20}}><img style={{width:45,height:45}} src="https://cdn.jsdelivr.net/gh/ShadyLabs-Web/shadylabs-assets@main/IMG-20260223-WA0003-removebg-preview.png" alt="ShadyLabs Image"></img> </div>
      <div style={{width:24,height:24,border:'2px solid #F59E0B',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/>
    </div>
  );

  return (
    <>
      {page==='landing' && <LandingPage onShowAuth={showAuth} onShowPricing={()=>setPage('pricing')}/>}
      {page==='pricing' && <PricingPage onShowAuth={showAuth} onBack={()=>setPage(user?'dashboard':'landing')} profile={profile}/>}
      {page==='dashboard' && user && <Dashboard user={user} profile={profile} onLogout={handleLogout} onShowPricing={()=>setPage('pricing')}/>}
      {authMode && <AuthModal mode={authMode} onClose={()=>setAuthMode(null)}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
